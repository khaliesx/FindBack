<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#204e43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FindBack">
<title>FindBack · Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* Same tokens as the live FindBack app */
  :root{
    --green:#285c49; --ink:#203c34; --lime:#d9edb6; --line:#e1e6dc;
    --muted:#667366; --orange:#d56b42; --paper:#f8f9f5; --white:#fff;
    --dot:#89a65d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"DM Sans",sans-serif;color:var(--ink);
    background:#e4e9e1;-webkit-font-smoothing:antialiased;
  }

  /* Phone frame — matches .phone-app on the live site */
  .phone-app{
    width:min(430px,100%);min-height:100dvh;margin:auto;
    background:var(--paper);box-shadow:0 0 80px rgba(40,67,46,.094);
    position:relative;overflow:hidden;
    display:flex;flex-direction:column;
    padding:0 28px calc(34px + env(safe-area-inset-bottom));
  }

  /* Soft background shapes */
  .blob{position:absolute;border-radius:50%;pointer-events:none}
  .blob.a{width:340px;height:340px;background:var(--lime);opacity:.55;top:-120px;right:-140px}
  .blob.b{width:220px;height:220px;border:1.5px solid var(--line);bottom:120px;left:-110px}

  /* Logo block */
  .hero{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;position:relative;z-index:1;
    animation:enter .6s ease both;
  }
  .brandmark{
    display:inline-flex;align-items:center;justify-content:center;
    width:96px;height:102px;border-radius:32px;
    background:var(--green);color:#fff;
    font-family:Manrope,sans-serif;font-size:88px;font-weight:500;line-height:1;
    position:relative;box-shadow:0 18px 40px -16px rgba(40,92,73,.55);
  }
  .brandmark span{
    position:absolute;right:8px;top:-22px;font-size:72px;color:var(--lime);
    animation:nudge 2.4s ease-in-out infinite;
  }
  .wordmark{
    margin-top:26px;font-family:Manrope,sans-serif;font-weight:800;
    font-size:42px;letter-spacing:-2px;
  }
  .wordmark .dot{color:var(--dot);margin-left:-3px}
  .tagline{margin-top:8px;color:var(--muted);font-size:16px}

  /* Login button */
  .actions{position:relative;z-index:1;animation:enter .6s .15s ease both}
  .btn-login{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;height:58px;border-radius:18px;
    background:var(--green);color:#fff;text-decoration:none;
    font-family:"DM Sans",sans-serif;font-weight:700;font-size:17px;
    box-shadow:0 12px 28px -14px rgba(40,92,73,.7);
    transition:transform .15s ease,background .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn-login:hover{background:#21503f}
  .btn-login:active{transform:scale(.98)}
  .btn-login:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
  .btn-login svg{width:20px;height:20px}

  @keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="phone-app">
    <div class="blob a"></div>
    <div class="blob b"></div>

    <section class="hero">
      <div class="brandmark" aria-hidden="true">f<span>↗</span></div>
      <h1 class="wordmark">findback<span class="dot">.</span></h1>
      <p class="tagline">A little lost. Almost home.</p>
    </section>

    <div class="actions">
      <!-- Goes to the app's Home screen. Change the href if the app lives at another path. -->
      <a class="btn-login" href="./#home" id="loginBtn">
        Start
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>
  </div>
</body>
</html>
