# Must match the existing Worker name so it keeps the same URL:
# https://findback.<account-subdomain>.workers.dev
name = "findback"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"   # unknown paths return 404 (keeps /models/ fallback to Hugging Face working)

[[d1_databases]]
binding = "DB"
database_name = "findback-db"
database_id = "f62f9bbb-d260-4a55-a96d-5581d199f116"   # printed by: npx wrangler d1 create findback-db
migrations_dir = "migrations"

[ai]
binding = "AI"

[vars]
# Labels this deployment as a prototype; no sign-in password is sent to browsers.
DEMO_MODE = "true"
# Set to "false" to stop residents creating their own accounts.
ALLOW_REGISTRATION = "true"
